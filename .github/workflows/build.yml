name: Build LaTeX

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Dev Container と同じイメージでビルドして環境差をなくす
    container: texlive/texlive:latest
    permissions:
      contents: write  # タグ push 時のリリース作成に必要
    steps:
      - uses: actions/checkout@v4

      - name: Build PDF with latexmk
        run: latexmk

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: pdf
          path: out/*.pdf

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log
          path: out/*.log

      - name: Create release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.pdf
